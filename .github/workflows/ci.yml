name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix services/rag ci
      - run: npx playwright install --with-deps chrome
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm --prefix services/rag test
      - run: npm run build
      - run: npm run test:ui
